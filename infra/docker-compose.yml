services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: northbound_helm
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm -d northbound_helm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://helm:helm@postgres:5432/northbound_helm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

